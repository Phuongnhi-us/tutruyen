<style>
:root{
  --p1:#FFF1F4;--p2:#FBE3EA;--p3:#F5D0DB;--p4:#EEBFCD;--p5:#E6AABD;--p6:#DD94AB;
  --bg:#F7ECEF;--surface:rgba(255,255,255,.66);--soft:#F8E4EA;--line:rgba(190,110,142,.26);
  --ink:#3D2430;--muted:#86606F;--accent:#A8426B;--accent-ink:#FFFFFF;
  --shadow:0 18px 38px -22px rgba(140,60,95,.5);
  --ui:'Be Vietnam Pro',system-ui,sans-serif;--display:'Cormorant Garamond','Playfair Display',Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171015;--surface:rgba(52,34,44,.62);--soft:#34222B;--line:rgba(254,177,198,.18);--ink:#F8E3E9;--muted:#C79AAA;--accent:#F4A9C0;--accent-ink:#3A1624;--shadow:0 18px 38px -22px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171015;--surface:rgba(52,34,44,.62);--soft:#34222B;--line:rgba(254,177,198,.18);--ink:#F8E3E9;--muted:#C79AAA;--accent:#F4A9C0;--accent-ink:#3A1624;--shadow:0 18px 38px -22px rgba(0,0,0,.7);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.6;min-height:100vh;
  background-image:linear-gradient(180deg,var(--p2) -40%,transparent 320px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:none}}
:root[data-theme="dark"] body{background-image:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:500;font-size:.92rem;transition:background .15s,transform .15s}
.btn:hover{background:var(--p2);color:#4A2130}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink);background:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:#B3263F}
.wrap{max-width:1040px;margin:0 auto;padding:36px clamp(16px,4vw,40px) 90px}
h1.page{font-family:var(--display);font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;margin-top:26px}
.book{cursor:pointer;text-align:left;background:none;border:0;padding:0}
.cover{aspect-ratio:3/4;border-radius:6px 14px 14px 6px;padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between;color:#4A2130;position:relative;overflow:hidden;box-shadow:var(--shadow);border-left:8px solid rgba(196,70,110,.35);transition:transform .2s}
.book:hover .cover{transform:translateY(-4px) rotate(-.6deg)}
.cover h3{font-family:var(--display);font-size:1.45rem;line-height:1.2;margin:0}
.cover small{font-size:.82rem;opacity:.8}
.cover::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35)}
.meta{margin-top:10px;color:var(--muted);font-size:.85rem}
.empty{margin-top:40px;padding:50px 24px;text-align:center;border:2px dashed var(--p5);border-radius:20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.chapters{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.ch{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ch .no{width:38px;height:38px;border-radius:50%;background:var(--p3);color:#4A2130;display:grid;place-items:center;font-weight:600;flex:none}
.ch .t{flex:1;min-width:0;cursor:pointer}
.ch .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .t span{color:var(--muted);font-size:.82rem}
.desc{max-width:680px;color:var(--muted);white-space:pre-wrap}
/* editor */
.ed{max-width:780px;margin:0 auto}
.ed-title{width:100%;border:0;background:transparent;font-family:var(--display);font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;padding:8px 0;border-bottom:2px solid var(--p5);outline:none}
.ed-text{width:100%;min-height:62vh;margin-top:18px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:26px clamp(16px,4vw,38px);font-family:'Lora',Georgia,serif;font-size:1.15rem;line-height:1.95;resize:vertical;outline:none;box-shadow:var(--shadow)}
.ed-text:focus{border-color:var(--p6)}
.bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.stat{color:var(--muted);font-size:.85rem;padding-left:8px}
/* dialog */
dialog{border:0;border-radius:20px;padding:26px;width:min(440px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(74,33,48,.45)}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 4px}
dialog input,dialog textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
/* tài khoản & thư viện chung */
.hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#loginBtn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:8px;margin-top:14px}
.dh{margin:0;font-family:var(--display);font-size:1.4rem}
.dp{color:var(--muted);font-size:.88rem;margin:6px 0 0}
.err{color:#B3263F;font-size:.85rem;margin:10px 0;min-height:1.3em}
/* reader */
.reader{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--rbg);color:var(--rink);transition:background .25s,color .25s;-webkit-overflow-scrolling:touch}
.reader[hidden]{display:none}
.reader[data-rt="light"]{--rbg:#FFFFFF;--rink:#2B2326;--rmuted:#8D7E83;--rpanel:#F7F2F3;--rline:#E8DEE1}
.reader[data-rt="rose"]{--rbg:#FFECEE;--rink:#4A2130;--rmuted:#9A6577;--rpanel:#FFE0E6;--rline:#FFC9D6}
.reader[data-rt="dark"]{--rbg:#17100F;--rink:#E7D8DB;--rmuted:#A28A91;--rpanel:#251A1D;--rline:#3A2A2F}
.rbar{position:sticky;top:0;z-index:3;padding:calc(10px + env(safe-area-inset-top,0px)) clamp(12px,3vw,28px) 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--rbg);border-bottom:1px solid var(--rline)}
.rbar .btn{background:var(--rpanel);border-color:var(--rline);color:var(--rink)}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--p6);width:0}
.rpanel{position:fixed;right:clamp(10px,3vw,28px);top:calc(64px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 20px));background:var(--rpanel);border:1px solid var(--rline);border-radius:18px;padding:18px;z-index:4;box-shadow:0 20px 50px -15px rgba(0,0,0,.35)}
.rpanel[hidden]{display:none}
.rpanel label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--rmuted);margin:12px 0 4px}
.rpanel select,.rpanel input[type=range]{width:100%}
.rpanel select{padding:8px 10px;border-radius:10px;border:1px solid var(--rline);background:var(--rbg);color:var(--rink)}
.rpanel input[type=range]{accent-color:#E0668A}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.themes button{padding:10px 4px;border-radius:12px;border:2px solid var(--rline);font-size:.85rem}
.themes button[aria-pressed=true]{border-color:#E0668A}
.article{margin:0 auto;padding:56px clamp(18px,5vw,40px) 40px}
.article h2{font-family:'Playfair Display',Georgia,serif;text-align:center;font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 10px;line-height:1.25}
.article .orn{text-align:center;color:#E0668A;letter-spacing:.6em;margin-bottom:36px}
.article p{margin:0;text-indent:1.6em;text-align:justify;hyphens:auto}
.article p+p{margin-top:.15em}
.article p:first-of-type{text-indent:0}
.rnav{display:flex;justify-content:space-between;gap:10px;margin:36px auto 80px;padding:0 clamp(18px,5vw,40px);max-width:760px}
.rnav .btn[disabled]{opacity:.35;cursor:default}
.toc{max-height:50vh;overflow:auto;margin-top:8px}
.toc button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;border-radius:10px;color:var(--rink)}
.toc button:hover,.toc button.on{background:var(--rline)}
.rbar{flex-wrap:wrap}.rbar .row{gap:6px}
.hl{border-radius:3px;padding:0 1px;color:inherit;cursor:pointer;background:rgba(254,177,198,.7)}
.hl[data-c=yellow]{background:rgba(255,214,10,.4)}.hl[data-c=green]{background:rgba(110,205,145,.42)}.hl[data-c=blue]{background:rgba(125,165,255,.42)}
.hl[data-c=bold]{background:none;font-weight:700;border-bottom:2px solid rgba(224,102,138,.65);border-radius:0}
.hl.n::after{content:"✎";font-size:.6em;vertical-align:super;margin:0 2px;color:#E0668A;font-weight:400}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--rpanel);border:1px solid var(--rline);border-radius:999px;box-shadow:0 14px 40px -12px rgba(0,0,0,.4);max-width:calc(100vw - 16px)}
.selbar[hidden],.nsheet[hidden]{display:none}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--rline);padding:0;flex:none;background:rgba(254,177,198,.95);color:var(--rink)}
.sw[data-c=yellow]{background:rgba(255,214,10,.75)}.sw[data-c=green]{background:rgba(110,205,145,.85)}.sw[data-c=blue]{background:rgba(125,165,255,.85)}
.sw.b{background:var(--rbg);font-weight:700;font-family:'Playfair Display',serif}
.sw[aria-pressed=true]{border-color:#E0668A;box-shadow:0 0 0 2px #E0668A}
.selbar .btn,.nsheet .btn{background:var(--rbg);border-color:var(--rline);color:var(--rink);padding:7px 14px}
.nsheet .btn.primary{background:#E0668A;border-color:#E0668A;color:#fff}
.nsheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 20px));z-index:7;background:var(--rpanel);border:1px solid var(--rline);border-radius:20px;padding:16px;box-shadow:0 20px 50px -15px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.nq{border-left:4px solid #E0668A;padding:2px 10px;font-size:.9rem;color:var(--rmuted);max-height:5em;overflow:auto;font-style:italic}
.nsheet textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--rline);background:var(--rbg);color:var(--rink);font-family:'Be Vietnam Pro',sans-serif;font-size:.95rem;resize:vertical}
.nl button small{display:block;color:var(--rmuted);font-size:.75rem}.nl button em{display:block;font-size:.85rem;margin-top:2px}
.selbar{flex-wrap:wrap;justify-content:center;border-radius:22px}
.ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 20px));z-index:6;background:var(--rpanel);border:1px solid var(--rline);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px -15px rgba(0,0,0,.45)}
.ttsbar[hidden]{display:none}
.ttsbar select{padding:7px 8px;border-radius:10px;border:1px solid var(--rline);background:var(--rbg);color:var(--rink);min-width:0;flex:1}
.ttsbar .btn{background:var(--rbg);border-color:var(--rline);color:var(--rink);padding:7px 14px}
.ttsbar .btn.primary{background:#E0668A;border-color:#E0668A;color:#fff}
.ttsbar small{color:var(--rmuted);font-size:.78rem}
.ttsbar .chk{font-size:.82rem;color:var(--rmuted);display:flex;gap:6px;align-items:center}
.tts-on .selbar{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.article p.reading{background:rgba(254,177,198,.35);border-radius:6px;box-shadow:0 0 0 6px rgba(254,177,198,.35)}
.dword{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.dl a{padding:6px 12px;border-radius:999px;border:1px solid var(--rline);background:var(--rbg);color:var(--rink);text-decoration:none;font-size:.85rem}
.article p.fig{text-indent:0;text-align:center;margin:1.6em 0}
.article p.fig img{max-width:100%;height:auto;border-radius:10px;box-shadow:0 10px 28px -12px rgba(0,0,0,.45);cursor:zoom-in}
.article .cap{display:block;font-size:.85em;opacity:.7;margin-top:.5em;font-style:italic;text-indent:0}
.lb{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb[hidden]{display:none}.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.imgs{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.th{position:relative}.th img{height:76px;border-radius:8px;border:1px solid var(--line);display:block}
.th button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:.7rem;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pw{border-bottom:2px dotted #E0668A;cursor:pointer;border-radius:2px}
.reader.nopic .pw{border-bottom:0;cursor:inherit}
.reader.nopic #picBtn{opacity:.5}
.pop{position:fixed;z-index:9;width:172px;padding:10px;background:var(--rpanel);border:1px solid var(--rline);border-radius:18px;box-shadow:0 14px 34px -10px rgba(0,0,0,.4);text-align:center;color:var(--rink);animation:pin .18s ease-out;cursor:pointer}
.pop[hidden]{display:none}
.pop svg{width:100%;height:auto;display:block;background:#FFF7F8;border-radius:12px}
.pop b{display:block;margin-top:8px;font-family:'Playfair Display',Georgia,serif}
@keyframes pin{from{opacity:0;transform:scale(.92)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

/* ===== Giao diện hoa ly sương: kính mờ, hạt nước, ánh ngọc trai ===== */
:root{--solid:#FFF8FA;--glass:rgba(255,255,255,.58);--glass-b:rgba(255,255,255,.8);--acc1:#A8426B;--acc2:#C0587D;--fx:1;
  --bgimg:radial-gradient(900px 620px at 88% -8%,rgba(246,196,212,.85),transparent 62%),radial-gradient(760px 560px at -6% 30%,rgba(231,226,232,.95),transparent 62%),radial-gradient(900px 700px at 75% 100%,rgba(240,186,204,.65),transparent 62%),linear-gradient(180deg,#FBF1F4,#F4E3E9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--solid:#261A21;--glass:rgba(66,44,56,.5);--glass-b:rgba(254,177,198,.16);--acc1:#F4A9C0;--acc2:#E58FAB;--fx:.4;
  --bgimg:radial-gradient(800px 560px at 88% -8%,rgba(176,84,120,.3),transparent 62%),radial-gradient(700px 520px at -6% 35%,rgba(120,100,130,.22),transparent 62%),linear-gradient(180deg,#1A1217,#140D11)}}
:root[data-theme="dark"]{--solid:#261A21;--glass:rgba(66,44,56,.5);--glass-b:rgba(254,177,198,.16);--acc1:#F4A9C0;--acc2:#E58FAB;--fx:.4;
  --bgimg:radial-gradient(800px 560px at 88% -8%,rgba(176,84,120,.3),transparent 62%),radial-gradient(700px 520px at -6% 35%,rgba(120,100,130,.22),transparent 62%),linear-gradient(180deg,#1A1217,#140D11)}

body{background-image:var(--bgimg);background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:var(--bgimg);background-attachment:fixed}}
:root[data-theme="dark"] body{background-image:var(--bgimg);background-attachment:fixed}

.top{background:color-mix(in srgb,var(--bg) 58%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.brand{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.75rem;letter-spacing:.01em;line-height:1.1}
h1.page{font-family:var(--display);font-weight:600;font-size:clamp(2.7rem,7vw,4.4rem);line-height:1.02;letter-spacing:-.01em;margin-bottom:10px}
.sub{font-size:1rem}
.btn{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 18px -12px rgba(140,60,95,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:hover{background:var(--solid);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--acc1),var(--acc2));border-color:rgba(255,255,255,.35);color:var(--accent-ink);box-shadow:0 12px 24px -12px rgba(168,66,107,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.primary:hover{background:linear-gradient(135deg,var(--acc1),var(--acc2));filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:none;backdrop-filter:none}
.btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc1),var(--acc2))}
.rnav .btn{background:var(--rpanel);border-color:var(--rline);color:var(--rink)}
.ch,.empty,.ed-text,.bar{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--glass-b)}
.ch{border-radius:18px;box-shadow:0 14px 30px -22px rgba(140,60,95,.55)}
.ch .no{background:radial-gradient(circle at 30% 25%,#fff,var(--p3));box-shadow:inset 0 -3px 6px rgba(190,110,142,.2)}
.empty{border:1.5px dashed var(--p5);border-radius:24px}
.ed-title{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,2.9rem)}
dialog{background:var(--solid);border:1px solid var(--glass-b);border-radius:24px}
dialog::backdrop{background:rgba(74,33,48,.35);backdrop-filter:blur(6px)}
dialog input,dialog textarea{background:var(--bg)}
.dh{font-family:var(--display);font-size:1.7rem;font-weight:600}
/* bìa sách ngọc trai */
.cover{border-radius:4px 20px 20px 4px;border-left:9px solid rgba(255,255,255,.55);color:#47212F;padding:24px 20px 20px;gap:16px;box-shadow:var(--shadow),inset 2px 0 6px rgba(120,50,80,.08);transition:transform .25s,box-shadow .25s}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.12) 36%,transparent 54%),radial-gradient(120% 60% at 100% 0,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.cover::after{right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 12%,rgba(255,255,255,.55) 13% 40%,rgba(255,255,255,.12) 64%,rgba(190,110,140,.2) 100%);box-shadow:inset -3px -4px 8px rgba(160,80,115,.18),0 6px 12px -6px rgba(120,50,80,.45)}
.cover h3{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:1.85rem;line-height:1.05;letter-spacing:-.005em}
.cinfo{position:relative;z-index:1;padding-right:48px}
.cover small{opacity:.85;font-size:.84rem}
.book:hover .cover{transform:translateY(-6px) rotate(-.8deg);box-shadow:0 26px 44px -22px rgba(140,60,95,.65),inset 2px 0 6px rgba(120,50,80,.08)}
.ctags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ctags span{font-size:.7rem;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:#5A2B3D}
.meta{margin-top:12px}
/* tìm kiếm & bộ lọc */
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.fsearch{flex:1 1 260px;position:relative;display:flex;align-items:center}
.fsearch svg{position:absolute;left:17px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.fsearch input,.fbar select{border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);outline:none;border-radius:999px;font-size:.95rem}
.fsearch input{width:100%;padding:13px 20px 13px 46px}
.fbar select{padding:12px 18px}
.fsearch input:focus,.fbar select:focus{border-color:var(--accent)}
.fchk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.85rem;color:var(--muted)}
.fchk input{accent-color:var(--accent)}
.fchips,.ntags{display:flex;gap:8px;flex-wrap:wrap}
.fchips{margin-top:14px}.ntags{margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:.85rem;color:var(--ink);transition:background .15s}
.chip:hover{background:var(--solid)}
.chip i{font-style:normal;font-size:.72rem;opacity:.65}
.chip.on,.chip.on:hover{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:var(--accent-ink);border-color:transparent}
.chip.tg{padding:4px 6px 4px 12px}
.chip.tg button{border:0;background:rgba(255,255,255,.3);color:inherit;width:18px;height:18px;border-radius:50%;padding:0;font-size:.6rem;line-height:1}
.fcount{margin-top:14px;color:var(--muted);font-size:.85rem}
#libGrid .grid,#pubGrid .grid{margin-top:14px}
#libGrid .empty,#pubGrid .empty{margin-top:14px}
#libGrid .empty .btn,#pubGrid .empty .btn{margin-top:10px}
/* hộp tag trong hộp thoại */
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tagchips{display:contents}
dialog .tagbox input{width:auto;flex:1;min-width:130px;border:0;background:transparent;padding:6px 6px;outline:none}
.tagbox:focus-within{border-color:var(--accent)}
.tagsug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagsug .chip{padding:3px 11px;font-size:.78rem;background:var(--bg)}
.tagnote{font-size:.8rem;color:var(--muted)}
/* trang đọc: tông hồng ngọc trai */
.reader[data-rt="rose"]{--rbg:#FAEEF1;--rink:#432230;--rmuted:#8D6676;--rpanel:#F4DCE4;--rline:#E9C5D2;background-image:radial-gradient(760px 520px at 92% -6%,rgba(246,196,212,.75),transparent 62%)}
.article h2{font-family:'Cormorant Garamond','Playfair Display',serif;font-weight:700;font-size:clamp(2rem,5vw,2.9rem)}

html{background:var(--bg)}
html body{background:transparent!important}
html::before{content:"";position:fixed;inset:-5%;z-index:-2;pointer-events:none;background:var(--veil),var(--water) center/cover no-repeat;animation:waterDrift 36s ease-in-out infinite alternate;will-change:transform}

.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(16px,4vw,48px);align-items:center;margin-bottom:12px}
.hero-t .sub{max-width:36ch}
.hero-i{position:relative;height:clamp(250px,34vw,410px);margin-bottom:18px}
.arch{position:absolute;background-size:cover;background-position:center;border:6px solid rgba(255,255,255,.78);box-shadow:0 30px 54px -26px rgba(120,50,80,.65),0 0 0 1px rgba(255,255,255,.55)}
.arch.a1{right:0;top:0;width:56%;height:100%;border-radius:999px 999px 30px 30px;background-image:var(--lily1);animation:lilyFloat 9s ease-in-out infinite alternate}
.arch.a2{left:0;bottom:-5%;width:52%;aspect-ratio:1;border-radius:50%;background-image:var(--lily2);background-position:62% 60%;animation:lilyFloat 11s ease-in-out -4s infinite alternate}
.hero-i::before,.hero-i::after{content:"\2726";position:absolute;color:#fff;text-shadow:0 0 10px rgba(255,190,215,.95),0 0 22px rgba(255,160,200,.8);animation:twinkle 3.4s ease-in-out infinite;z-index:2;pointer-events:none}
.hero-i::before{left:46%;top:2%;font-size:1.7rem}
.hero-i::after{left:6%;top:22%;font-size:1.1rem;animation-delay:-1.6s}
@keyframes lilyFloat{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-i{height:250px;max-width:360px;width:100%;margin:0 auto 18px}}
.cover::after{background:var(--cameo) center/cover no-repeat;border:3px solid rgba(255,255,255,.9);width:54px;height:54px;box-shadow:0 8px 16px -6px rgba(120,50,80,.5),inset 0 0 0 1px rgba(255,255,255,.4)}
.cinfo{padding-right:56px}
.brand::before{content:"";display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--cameo) center/cover;margin-right:9px;vertical-align:-8px;border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 10px -4px rgba(120,50,80,.5)}
.article h2::before{content:"";display:block;width:60px;height:60px;margin:0 auto 16px;border-radius:50%;background:var(--cameo) center/cover;border:3px solid rgba(255,255,255,.9);box-shadow:0 8px 18px -8px rgba(120,50,80,.55)}
.empty::before{content:"";display:block;width:104px;height:104px;margin:0 auto 14px;border-radius:50%;background:var(--cameo) center/cover;border:4px solid rgba(255,255,255,.9);box-shadow:0 14px 28px -14px rgba(120,50,80,.6)}
.empty>div[style*="2.4rem"]{display:none}
@media (prefers-reduced-motion:reduce){.arch,.hero-i::before,.hero-i::after{animation:none}}

html::before{content:none}
#bgstack{position:fixed;inset:-5%;z-index:-2;pointer-events:none;animation:waterDrift 42s ease-in-out infinite alternate;will-change:transform}
#bgstack i{position:absolute;inset:0;opacity:0;background:var(--veil),var(--bgA) center/cover no-repeat;animation:bgFade 66s linear infinite}
#bgstack i:nth-child(1){animation-delay:-2s}
#bgstack i:nth-child(2){background-image:var(--veil),var(--bgB);animation-delay:-46s}
#bgstack i:nth-child(3){background-image:var(--veil),var(--bgC);animation-delay:-24s}
@keyframes bgFade{0%{opacity:0}6%{opacity:1}33%{opacity:1}39%{opacity:0}100%{opacity:0}}
.brand{color:var(--acc1);text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.65),0 6px 12px rgba(224,102,138,.4);letter-spacing:.02em}
.ic{width:1.5em;height:1.5em;flex:none;filter:drop-shadow(0 2px 1.5px rgba(150,40,80,.42))}
.hdr{gap:12px;padding-bottom:5px}
.hdr .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:8px 18px 9px;border:0;border-radius:999px;font-weight:600;letter-spacing:.01em;color:#5A1A38;text-shadow:0 1px 0 rgba(255,255,255,.7);
  background:linear-gradient(180deg,#FFE6EE 0%,#FFC4D6 46%,#FF9EBD 100%);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 5px rgba(200,60,110,.3),0 5px 0 #D9608A,0 11px 16px -5px rgba(190,60,105,.55);
  transform:translateY(0);transition:transform .12s,box-shadow .12s,filter .15s}
.hdr .btn::after{content:"";position:absolute;left:10%;right:10%;top:2px;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}
.hdr .btn>*{position:relative;z-index:1}
.hdr .btn:hover{background:linear-gradient(180deg,#FFEEF3 0%,#FFCDDC 46%,#FFA9C4 100%);color:#5A1A38;transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 5px rgba(200,60,110,.3),0 7px 0 #D9608A,0 16px 20px -6px rgba(190,60,105,.6)}
.hdr .btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -2px 4px rgba(200,60,110,.3),0 1px 0 #D9608A,0 3px 6px -2px rgba(190,60,105,.5)}
#loginBtn span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.hdr{gap:8px}.hdr .btn{padding:7px 12px 8px;font-size:.84rem}.brand{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){#bgstack,#bgstack i{animation:none}#bgstack i:nth-child(1){opacity:1}.hdr .btn{transition:none}}
.ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.ttl h1.page{margin:0}
.btn.ico{width:44px;height:44px;padding:0;display:inline-grid;place-items:center;border:0;border-radius:50%;background:linear-gradient(180deg,#FFE6EE,#FFC4D6 46%,#FF9EBD);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 5px rgba(200,60,110,.3),0 4px 0 #D9608A,0 9px 14px -5px rgba(190,60,105,.55);transition:transform .12s,box-shadow .12s}
.btn.ico:hover{background:linear-gradient(180deg,#FFEEF3,#FFCDDC 46%,#FFA9C4);transform:translateY(-2px)}
.btn.ico:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.8),0 1px 0 #D9608A}
.ttl-in{flex:1;min-width:200px;font-family:var(--display);font-size:clamp(1.6rem,4vw,2.6rem);font-weight:600;padding:6px 16px;border-radius:18px;border:2px solid var(--acc2);background:var(--solid);color:var(--ink);outline:none;box-shadow:0 0 0 4px rgba(224,102,138,.18)}

/* ===== Sửa phông chữ tiếng Việt (bìa, tiêu đề): không bị cắt dấu, không chồng dòng ===== */
.cover h3{font-family:'Playfair Display','Be Vietnam Pro',Georgia,serif;font-weight:700;font-style:normal;font-size:1.5rem;line-height:1.38;letter-spacing:0;padding:.12em 0 .14em;margin:0;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;text-rendering:optimizeLegibility}
.cover small,.ctags span{font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.5}
h1.page{line-height:1.25;padding-top:.1em;overflow-wrap:anywhere}
.brand{line-height:1.35}
.ttl-in{line-height:1.35}
dialog h3,.dh,.dword{line-height:1.35}
@media (max-width:560px){.cover h3{font-size:1.28rem}}

/* ===== Thanh công cụ đọc: gọn, chữ rõ, không biểu tượng ===== */
.rbar{gap:10px 12px;align-items:center}
.rbar .rback{display:inline-flex;align-items:center;gap:9px;padding:8px 18px 8px 14px;font-weight:600;font-size:.92rem;border-radius:999px;border:1px solid var(--rline);background:var(--rpanel);color:var(--rink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -12px rgba(120,50,80,.6)}
.rback::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:4px}
.rright{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0}
.rbar #rsave{background:linear-gradient(180deg,#FFD0DF,#FF9EBD);color:#5A1A38;border:0;font-weight:600;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 0 #D9608A,0 8px 12px -4px rgba(190,60,105,.5)}
.rtools{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--rpanel);border:1px solid var(--rline);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 20px -14px rgba(120,50,80,.6);overflow-x:auto;max-width:100%;scrollbar-width:none}
.rtools::-webkit-scrollbar{display:none}
.rt{border:0;background:transparent;color:var(--rink);font-weight:500;font-size:.9rem;padding:7px 15px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.rt:hover{background:rgba(224,102,138,.16)}
.rt.on{background:linear-gradient(180deg,#FFC9DA,#FF9EBD);color:#5A1A38;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 3px 8px -3px rgba(200,60,110,.55)}
.reader.nopic #picBtn{opacity:.55;text-decoration:line-through}

let tmp=null;
const K='nhavanhong-v1',SK='nhavanhong-reader-v1',TK='nhavanhong-theme';
let db={novels:[]},rs={font:"'Lora',serif",size:19,lh:1.9,w:680,theme:'rose'},view={n:'lib'},timer=null,dlgMode='new';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const covers=['#F7D5DF','#F1C3D2','#E9B4C6','#F4DCE4','#E7D8DE','#FAE8ED'];
function load(){
  try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.novels)db=d}catch(e){}
  try{Object.assign(rs,JSON.parse(localStorage.getItem(SK))||{})}catch(e){}
  try{const t=localStorage.getItem(TK);if(t)document.documentElement.dataset.theme=t}catch(e){}
}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
function saveRs(){try{localStorage.setItem(SK,JSON.stringify(rs))}catch(e){}}
const novel=()=>view.id==='tmp'?tmp:db.novels.find(n=>n.id===view.id);
const chap=()=>novel()?.chapters.find(c=>c.id===view.cid);
const total=n=>n.chapters.reduce((a,c)=>a+words(c.content),0);


/* ===== tag + tìm kiếm + bộ lọc ===== */
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
const cleanTag=s=>String(s==null?'':s).replace(/^[#\s]+/,'').replace(/[,;]+/g,' ').replace(/\s+/g,' ').trim().slice(0,24);
function cleanTags(a){const out=[],seen=new Set();if(Array.isArray(a))for(const x of a){const t=cleanTag(x),k=norm(t);if(t&&!seen.has(k)&&out.length<12){seen.add(k);out.push(t)}}return out}
const hsh=id=>[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0);
const coverBg=id=>{const h=hsh(id);return `linear-gradient(155deg,${covers[h%6]},${covers[(h+3)%6]})`};
const LF={q:'',tags:[],body:false,sort:'new'},PF={q:'',tags:[],body:false,sort:'new'};
let dTags=[],fT=null;
function tagIndex(list){const m=new Map();for(const n of list)for(const t of (n.tags||[])){const k=norm(t);if(!k)continue;const e=m.get(k);if(e)e.n++;else m.set(k,{key:k,label:t,n:1})}return m}
function addTag(s){const t=cleanTag(s),k=norm(t);if(!t||dTags.length>=12||dTags.some(x=>norm(x)===k))return false;dTags.push(t);return true}
function paintTagBox(){
  const c=$('#tagChips'),g=$('#tagSug');if(!c||!g)return;
  c.innerHTML=dTags.map((t,i)=>`<span class="chip on tg">${esc(t)}<button type="button" data-act="tagrm" data-i="${i}" aria-label="Bỏ tag ${esc(t)}">✕</button></span>`).join('');
  const have=new Set(dTags.map(norm)),seen=new Set(),sug=[];
  for(const t of [...[...tagIndex(db.novels).values()].map(x=>x.label),'Ngôn tình','Kiếm hiệp','Fantasy','Học đường','Trinh thám','Kinh dị','Truyện ngắn','Đang viết']){const k=norm(t);if(!have.has(k)&&!seen.has(k)){seen.add(k);sug.push(t)}}
  g.innerHTML=dTags.length>=12?'<span class="tagnote">Tối đa 12 tag cho mỗi truyện.</span>':sug.slice(0,10).map(t=>`<button type="button" class="chip" data-act="tagadd" data-t="${esc(t)}">+ ${esc(t)}</button>`).join('');
}
$('#fTag').addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(e.target.value);e.target.value='';paintTagBox()}
  else if(e.key==='Backspace'&&!e.target.value&&dTags.length){dTags.pop();paintTagBox()}
});
$('#fTag').addEventListener('input',e=>{if(!e.isComposing&&e.target.value.includes(',')){e.target.value.split(',').forEach(addTag);e.target.value='';paintTagBox()}});

function nvMatch(n,F){
  const tg=(n.tags||[]).map(norm);
  if(F.tags.some(t=>!tg.includes(norm(t))))return false;
  const terms=norm(F.q).split(/\s+/).filter(Boolean);if(!terms.length)return true;
  let h=norm([n.title,n.author,n.ownerName,n.desc,(n.tags||[]).join(' ')].join(' | '));
  if(F.body&&n.chapters)h+=' | '+norm(n.chapters.map(c=>(c.title||'')+' '+(c.content||'')).join(' '));
  return terms.every(t=>h.includes(t));
}
const wordsOf=n=>n.chapters?total(n):(+n.words||0);
function sortList(a,F){a=a.slice();if(F.sort==='az')a.sort((x,y)=>String(x.title).localeCompare(String(y.title),'vi'));else if(F.sort==='long')a.sort((x,y)=>wordsOf(y)-wordsOf(x));return a}
function filterBar(s){
  const F=s==='l'?LF:PF,b=s==='l'?'lib':'pub';
  return `<div class="fbar"><label class="fsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="${b}Q" type="search" placeholder="Tìm theo tên truyện, tác giả hoặc tag" value="${esc(F.q)}" autocomplete="off" aria-label="Tìm truyện"></label>
  <select id="${b}Sort" aria-label="Sắp xếp">${[['new','Mới nhất'],['az','Tên A → Z'],['long','Dài nhất']].map(([v,t])=>`<option value="${v}" ${F.sort===v?'selected':''}>${t}</option>`).join('')}</select></div>
  ${s==='l'?`<label class="fchk"><input type="checkbox" id="libBody" ${F.body?'checked':''}> Tìm cả trong nội dung các chương</label>`:''}
  <div class="fchips" id="${b}Chips"></div><div class="fcount" id="${b}Count" aria-live="polite"></div><div id="${b}Grid"></div>`;
}
function chipsHtml(s,idx,F){
  if(!idx.size)return '';
  const on=k=>F.tags.some(t=>norm(t)===k),arr=[...idx.values()].sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label,'vi'));
  return `<button class="chip${F.tags.length?'':' on'}" data-act="fclear" data-s="${s}" aria-pressed="${!F.tags.length}">Tất cả</button>`+
    arr.map(t=>`<button class="chip${on(t.key)?' on':''}" data-act="ftag" data-s="${s}" data-t="${esc(t.label)}" aria-pressed="${on(t.key)}">${esc(t.label)} <i>${t.n}</i></button>`).join('');
}
function cardsHtml(list,lib){
  return `<div class="grid">${list.map(s=>{
    const tg=s.tags||[],au=esc(s.author||(lib?'':s.ownerName)||'Chưa rõ tác giả');
    const meta=lib?`${s.chapters.length} chương · ${total(s).toLocaleString('vi-VN')} từ`:`${+s.chapterCount||0} chương · ${(+s.words||0).toLocaleString('vi-VN')} từ<br>Đăng bởi ${esc(s.ownerName||'ẩn danh')}`;
    return `<button class="book" data-act="${lib?'openNovel':'openPub'}" data-id="${esc(s.id)}"><div class="cover" style="background:${coverBg(s.id)}"><h3>${esc(s.title)}</h3><div class="cinfo">${tg.length?`<div class="ctags">${tg.slice(0,3).map(t=>`<span>${esc(t)}</span>`).join('')}${tg.length>3?`<span>+${tg.length-3}</span>`:''}</div>`:''}<small>${au}</small></div></div><div class="meta">${meta}</div></button>`}).join('')}</div>`;
}
function paintFilter(s){
  const lib=s==='l',F=lib?LF:PF,list=lib?db.novels:(pubCache||[]),b=lib?'lib':'pub';
  const idx=tagIndex(list);F.tags=F.tags.filter(t=>idx.has(norm(t)));
  const chips=$('#'+b+'Chips'),grid=$('#'+b+'Grid'),cnt=$('#'+b+'Count');if(!grid)return;
  const res=sortList(list.filter(n=>nvMatch(n,F)),F);
  if(chips)chips.innerHTML=chipsHtml(s,idx,F);
  if(cnt)cnt.textContent=res.length===list.length?list.length+' truyện':res.length+' / '+list.length+' truyện';
  grid.innerHTML=res.length?cardsHtml(res,lib):`<div class="empty"><p>Không có truyện nào khớp với bộ lọc.</p><button class="btn" data-act="fclear" data-s="${s}" data-all="1">Xóa bộ lọc</button></div>`;
}
document.addEventListener('input',e=>{
  const id=e.target.id;if(id!=='libQ'&&id!=='pubQ')return;
  const s=id==='libQ'?'l':'p';(s==='l'?LF:PF).q=e.target.value;clearTimeout(fT);fT=setTimeout(()=>paintFilter(s),140);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='libSort'||id==='pubSort'){const s=id==='libSort'?'l':'p';(s==='l'?LF:PF).sort=e.target.value;paintFilter(s)}
  else if(id==='libBody'){LF.body=e.target.checked;paintFilter('l')}
});

function render(){
  if(view.n==='pub'){renderPub();return}
  const n=novel();
  if(view.n==='lib'||!n){view.n='lib';
    app.innerHTML=`<div class="wrap"><section class="hero"><div class="hero-t"><h1 class="page">Tủ truyện của bạn</h1><p class="sub">Mỗi bộ tiểu thuyết là một cuốn sách riêng, tự động lưu trên trình duyệt này.</p>
    <button class="btn primary" data-act="newNovel">+ Bắt đầu một bộ truyện</button> <button class="btn" data-act="openFile">📄 Đọc tệp có sẵn</button></div><div class="hero-i" aria-hidden="true"><div class="arch a1"></div><div class="arch a2"></div></div></section>
    ${db.novels.length?filterBar('l'):`<div class="empty"><div style="font-size:2.4rem">✿</div><p>Chưa có truyện nào. Hãy đặt tên cho bộ tiểu thuyết đầu tiên của bạn.</p></div>`}</div>`;
    if(db.novels.length)paintFilter('l');
  }else if(view.n==='novel'){
    app.innerHTML=`<div class="wrap"><button class="btn ghost" data-act="home">← Tủ truyện</button>
    <div class="ttl" id="ttlBox"><h1 class="page">${esc(n.title)}</h1><button class="btn ico" data-act="renameNovel" aria-label="Đổi tên truyện" title="Đổi tên truyện"><svg class="ic" aria-hidden="true"><use href="#ic-pen"/></svg></button></div><p class="sub">${esc(n.author||'Chưa rõ tác giả')} · ${n.chapters.length} chương · ${total(n).toLocaleString('vi-VN')} từ</p>
    ${(n.tags||[]).length?`<div class="ntags">${n.tags.map(t=>`<button class="chip" data-act="tagGo" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}
    ${n.desc?`<p class="desc">${esc(n.desc)}</p>`:''}
    <div class="row" style="margin-top:18px"><button class="btn primary" data-act="newChap">+ Chương mới</button>
    <button class="btn" data-act="readFirst" ${n.chapters.length?'':'disabled'}>Đọc từ đầu</button>
    <button class="btn" data-act="editNovel">Sửa thông tin</button>${pubBtns(n)}<button class="btn danger" data-act="delNovel">Xóa truyện</button></div>
    <div class="chapters">${n.chapters.length?n.chapters.map((c,i)=>`<div class="ch"><div class="no">${i+1}</div><div class="t" data-act="edit" data-id="${c.id}"><b>${esc(c.title||'Chương chưa đặt tên')}</b><span>${words(c.content).toLocaleString('vi-VN')} từ</span></div>
    <button class="btn" data-act="read" data-id="${c.id}">Đọc</button><button class="btn" data-act="edit" data-id="${c.id}">Viết</button><button class="btn danger" data-act="delChap" data-id="${c.id}" aria-label="Xóa chương">✕</button></div>`).join(''):`<div class="empty"><p>Truyện chưa có chương nào. Thêm chương đầu tiên để bắt đầu viết.</p></div>`}</div></div>`;
  }else if(view.n==='edit'){
    const c=chap(),i=n.chapters.indexOf(c);
    app.innerHTML=`<div class="wrap"><div class="ed"><div class="row" style="justify-content:space-between;margin-bottom:14px"><button class="btn ghost" data-act="openNovel" data-id="${n.id}">← ${esc(n.title)}</button><span class="stat">Chương ${i+1}/${n.chapters.length}</span></div>
    <input class="ed-title" id="cTitle" placeholder="Tên chương…" value="${esc(c.title)}">
    <textarea class="ed-text" id="cText" placeholder="Bắt đầu viết câu chuyện của bạn… Mỗi lần xuống dòng sẽ thành một đoạn mới.">${esc(c.content)}</textarea>
    <div class="imgs" id="imgs"></div><div class="bar"><span class="stat" id="stat"></span><div class="row">
    <button class="btn" data-act="prev" ${i?'':'disabled'}>‹ Trước</button><button class="btn" data-act="next" ${i<n.chapters.length-1?'':'disabled'}>Sau ›</button>
    <button class="btn" data-act="newChap">+ Chương</button><button class="btn" data-act="addimg">🖼 Ảnh</button><button class="btn primary" data-act="read" data-id="${c.id}">Xuất ra bản đọc</button></div></div></div></div>`;
    upStat();
  }
  window.scrollTo(0,0);if(view.n==='edit')paintImgs();
}
function upStat(saved){const c=chap(),s=$('#stat');if(c&&s)s.textContent=`${words(c.content).toLocaleString('vi-VN')} từ · ${saved?'Đã lưu ✓':'Tự động lưu'}`}

/* reader */
function applyRs(){
  const r=$('#reader'),a=$('#article');r.dataset.rt=rs.theme;r.classList.toggle('nopic',rs.pic===false);
  a.style.cssText=`font-family:${rs.font};font-size:${rs.size}px;line-height:${rs.lh};max-width:${rs.w}px`;
  $('#rnav').style.maxWidth=rs.w+'px';
}
function openReader(cid){
  view.cid=cid;const n=novel(),c=chap(),i=n.chapters.indexOf(c);$('#rsave').hidden=!(tmp&&view.id==='tmp');$('#selbar').hidden=true;$('#nsheet').hidden=true;$('#dsheet').hidden=true;ttsStop();pend=null;
  $('#article').innerHTML=`<h2>${esc(c.title||'Chương '+(i+1))}</h2><div class="orn">✿ ✿ ✿</div>`+
    (c.content.trim()?paras(c):'<p style="text-align:center;text-indent:0;opacity:.6">Chương này chưa có nội dung.</p>');
  $('#rnav').innerHTML=`<button class="btn" data-act="rprev" ${i?'':'disabled'}>‹ Chương trước</button><button class="btn" data-act="rnext" ${i<n.chapters.length-1?'':'disabled'}>Chương sau ›</button>`;
  $('#rpanel').hidden=true;$('#reader').hidden=false;$('#reader').scrollTop=0;document.body.style.overflow='hidden';applyRs();wrapPics();
}
function panel(mode){
  const p=$('#rpanel'),n=novel();
  if(mode==='dict'){p.innerHTML=dictHtml()}
  else if(mode==='notes'){p.innerHTML=notesHtml()}
  else if(mode==='toc'){p.innerHTML=`<b>Mục lục</b><div class="toc">${n.chapters.map((c,i)=>`<button data-act="rgo" data-id="${c.id}" class="${c.id===view.cid?'on':''}">${i+1}. ${esc(c.title||'Chưa đặt tên')}</button>`).join('')}</div>`}
  else{p.innerHTML=`<b>Tùy chỉnh đọc</b>
  <label>Phông chữ</label><select id="sFont">${[["'Lora',serif","Lora – cổ điển"],["'Merriweather',serif","Merriweather – dễ đọc"],["'Playfair Display',serif","Playfair – thanh lịch"],["'Be Vietnam Pro',sans-serif","Be Vietnam Pro – hiện đại"]].map(([v,t])=>`<option value="${v}" ${v===rs.font?'selected':''}>${t}</option>`).join('')}</select>
  <label><span>Cỡ chữ</span><span id="vSize">${rs.size}px</span></label><input type="range" id="sSize" min="14" max="30" value="${rs.size}">
  <label><span>Giãn dòng</span><span id="vLh">${rs.lh}</span></label><input type="range" id="sLh" min="1.4" max="2.4" step=".1" value="${rs.lh}">
  <label><span>Độ rộng cột</span><span id="vW">${rs.w}px</span></label><input type="range" id="sW" min="480" max="900" step="20" value="${rs.w}">
  <label>Màu nền</label><div class="themes">
  <button data-act="rtheme" data-t="light" aria-pressed="${rs.theme==='light'}" style="background:#fff;color:#2B2326">Sáng</button>
  <button data-act="rtheme" data-t="rose" aria-pressed="${rs.theme==='rose'}" style="background:#FFECEE;color:#4A2130">Hồng dịu</button>
  <button data-act="rtheme" data-t="dark" aria-pressed="${rs.theme==='dark'}" style="background:#17100F;color:#E7D8DB">Tối</button></div>`}
  p.hidden=false;
}
$('#reader').addEventListener('scroll',e=>{const r=e.target,m=r.scrollHeight-r.clientHeight;$('#prog').style.width=(m>0?r.scrollTop/m*100:0)+'%'});
document.addEventListener('input',e=>{
  const t=e.target,c=chap();
  if(t.id==='cTitle'||t.id==='cText'){c.title=$('#cTitle').value;c.content=$('#cText').value;upStat();clearTimeout(timer);timer=setTimeout(()=>{save();upStat(true)},500)}
  if(t.id==='sFont')rs.font=t.value;
  if(t.id==='sSize'){rs.size=+t.value;$('#vSize').textContent=t.value+'px'}
  if(t.id==='sLh'){rs.lh=+t.value;$('#vLh').textContent=t.value}
  if(t.id==='sW'){rs.w=+t.value;$('#vW').textContent=t.value+'px'}
  if(t.id.startsWith('s')&&t.closest('#rpanel')){applyRs();saveRs()}
});
function flush(){clearTimeout(timer);save()}
function goChap(d){flush();const n=novel(),i=n.chapters.indexOf(chap())+d;if(n.chapters[i]){view.cid=n.chapters[i].id;render()}}
function openDlg(mode){
  dlgMode=mode;const n=mode==='edit'?novel():{title:'',author:'',desc:''};
  $('#dlgTitle').textContent=mode==='edit'?'Sửa thông tin truyện':'Truyện mới';
  $('#fTitle').value=n.title;$('#fAuthor').value=n.author;$('#fDesc').value=n.desc;dTags=cleanTags(n.tags);$('#fTag').value='';paintTagBox();$('#dlg').showModal();
}
$('#dlgCancel').onclick=()=>$('#dlg').close();
$('#dlgForm').addEventListener('submit',()=>{
  addTag($('#fTag').value);$('#fTag').value='';
  const v={title:$('#fTitle').value.trim(),author:$('#fAuthor').value.trim(),desc:$('#fDesc').value.trim(),tags:dTags.slice()};
  if(!v.title)return;
  if(dlgMode==='edit')Object.assign(novel(),v);else{const n={id:uid(),...v,chapters:[]};db.novels.unshift(n);view={n:'novel',id:n.id}}
  save();render();
});
function startRename(){
  const n=novel(),box=$('#ttlBox');if(!n||!box)return;
  box.innerHTML=`<input class="ttl-in" id="ttlIn" maxlength="120" value="${esc(n.title)}" aria-label="Tên truyện"><button class="btn primary" data-act="renameSave">Lưu</button><button class="btn" data-act="renameCancel">Hủy</button>`;
  const i=$('#ttlIn');i.focus();i.select();
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finishRename(true)}else if(e.key==='Escape')finishRename(false)});
}
function finishRename(ok){
  const n=novel();let note=false;
  if(ok&&n){const v=$('#ttlIn').value.trim();if(v&&v!==n.title){n.title=v;save();note=!!n.pubId}}
  render();
  if(note)alert('Đã đổi tên truyện. Tên trên thư viện chung sẽ đổi sau khi bạn bấm “Cập nhật bản đã đăng”.');
}
function newChap(){const n=novel();const c={id:uid(),title:'Chương '+(n.chapters.length+1),content:''};n.chapters.push(c);save();view={n:'edit',id:n.id,cid:c.id};render()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,n=view.id?novel():null;
  switch(a){
    case 'home':ttsStop();flush();$('#reader').hidden=true;document.body.style.overflow='';view={n:'lib'};render();break;
    case 'theme':{const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(TK,r.dataset.theme)}catch(x){}themeLbl();break}
    case 'newNovel':openDlg('new');break;
    case 'openFile':$('#dlg2').showModal();break;
    case 'fileGo':importFile();break;
    case 'rsave':{saveTmp();break}
    case 'renameNovel':startRename();break;
    case 'renameSave':finishRename(true);break;
    case 'renameCancel':finishRename(false);break;
    case 'editNovel':openDlg('edit');break;
    case 'openNovel':flush();view={n:'novel',id:id||view.id};render();break;
    case 'delNovel':if(confirm('Xóa toàn bộ truyện này? Không thể khôi phục.')){db.novels=db.novels.filter(x=>x.id!==n.id);save();view={n:'lib'};render()}break;
    case 'newChap':newChap();break;
    case 'edit':view={n:'edit',id:view.id,cid:id};render();break;
    case 'delChap':if(confirm('Xóa chương này?')){n.chapters=n.chapters.filter(c=>c.id!==id);save();render()}break;
    case 'prev':goChap(-1);break;case 'next':goChap(1);break;
    case 'read':flush();view.cid=id;openReader(id);break;
    case 'readFirst':openReader(n.chapters[0].id);break;
    case 'rpic':rs.pic=rs.pic===false;saveRs();applyRs();closePop();break;
    case 'rclose':ttsStop();$('#reader').hidden=true;document.body.style.overflow='';render();break;
    case 'rset':{const p=$('#rpanel');if(!p.hidden&&p.dataset.m==='set')p.hidden=true;else{panel('set');p.dataset.m='set'}break}
    case 'rtoc':{const p=$('#rpanel');if(!p.hidden&&p.dataset.m==='toc')p.hidden=true;else{panel('toc');p.dataset.m='toc'}break}
    case 'rgo':openReader(id);break;

    if(navI){const p=R(base,navI.getAttribute('href')),d=new DOMParser().parseFromString(await rd(p),'text/html');
      d.querySelectorAll('nav a[href]').forEach(a=>{const k=R(dirOf(p),a.getAttribute('href'));if(!tocMap.has(k))tocMap.set(k,a.textContent.trim().replace(/\s+/g,' '))})}
    else if(ncxI){const p=R(base,ncxI.getAttribute('href')),d=xml(await rd(p));
      [...d.getElementsByTagName('navPoint')].forEach(n=>{const c=n.getElementsByTagName('content')[0],t=n.getElementsByTagName('text')[0];if(c&&t){const k=R(dirOf(p),c.getAttribute('src'));if(!tocMap.has(k))tocMap.set(k,t.textContent.trim())}})}
  }catch(e){}
  const out=[];
  for(const ref of opf.getElementsByTagName('itemref')){
    const it=man[ref.getAttribute('idref')];if(!it)continue;
    const p=R(base,it.getAttribute('href')),d=new DOMParser().parseFromString(await rd(p),'text/html');
    d.querySelectorAll('script,style,nav').forEach(e=>e.remove());
    for(const im of [...d.querySelectorAll('img,image')]){
      const h=im.getAttribute('src')||im.getAttribute('xlink:href')||im.getAttribute('href');let tok='\n';
      try{const fp=R(dirOf(p),h),z=zip.file(fp);
        if(z){const b64=await z.async('base64'),ext=(fp.split('.').pop()||'').toLowerCase(),mime=ext==='png'?'image/png':ext==='gif'?'image/gif':ext==='webp'?'image/webp':ext==='svg'?'image/svg+xml':'image/jpeg';
          if(b64.length>3000){const id='e'+uid();imgMem[id]=`data:${mime};base64,${b64}`;tok=`\n[[img:${id}]]\n`}}}catch(e){}
      im.replaceWith(d.createTextNode(tok));
    }
    const heading=d.querySelector('h1,h2,h3')?.textContent.trim().replace(/\s+/g,' ')||'';
    d.querySelectorAll('br').forEach(e=>e.after('\n'));
    d.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,blockquote,tr').forEach(e=>e.append('\n'));
    let text=(d.body?.textContent||'').split('\n').map(s=>s.trim()).filter(Boolean).join('\n');
    if(text.length<30&&!/\[\[img:/.test(text))continue;
    const title=tocMap.size?(tocMap.get(p)||''):heading;
    if(tocMap.size&&!title&&out.length){out[out.length-1].content+='\n'+text;continue}
    const lines=text.split('\n');
    if(heading&&lines[0]===heading&&(!title||title===heading))text=lines.slice(1).join('\n');
    out.push({id:uid(),title:title||heading||(out.length?'Phần '+(out.length+1):'Mở đầu'),content:text});
  }
  const g=t=>opf.getElementsByTagName(t)[0]?.textContent.trim()||'';
  return{title:g('dc:title'),author:g('dc:creator'),chapters:out};
}

function pubBtns(n){

}
async function commitOps(ops){
  let b=fb.f.writeBatch(fb.fs),c=0,sz=0;
  for(const o of ops){
    if(c&&(c>=400||sz+o.sz>7e6)){await b.commit();b=fb.f.writeBatch(fb.fs);c=0;sz=0}
    o.f(b);c++;sz+=o.sz;
  }
  if(c)await b.commit();
}
async function doPublish(n){
  const F=fb.f,u=fb.user;
  for(const c of n.chapters){if(new Blob([c.content||'']).size>900000)throw new Error('Chương “'+(c.title||'chưa đặt tên')+'” dài hơn 900 KB, hãy tách nhỏ ra trước khi đăng.')}
  if(!n.pubId||n.pubOwner!==u.uid){n.pubId=F.doc(F.collection(fb.fs,'stories')).id;n.pubOwner=u.uid;n.pubAt=Date.now();n.pubImgs=[]}
  const sref=F.doc(fb.fs,'stories',n.pubId);
  await F.setDoc(sref,{ownerUid:u.uid,ownerName:userName(u),title:n.title,author:n.author||'',desc:n.desc||'',tags:cleanTags(n.tags),chapterCount:n.chapters.length,words:total(n),createdAt:n.pubAt||Date.now(),updatedAt:Date.now()});
  const old=await F.getDocs(F.collection(sref,'chapters')),keep=new Set(n.chapters.map(c=>c.id)),ops=[];
  old.forEach(d=>{if(!keep.has(d.id))ops.push({f:b=>b.delete(d.ref),sz:1})});
  n.chapters.forEach((c,i)=>ops.push({f:b=>b.set(F.doc(sref,'chapters',c.id),{order:i,title:c.title||'',content:c.content||''}),sz:(c.content||'').length*3+200}));
  const have=new Set(n.pubImgs||[]),used=new Set(),sent=[];
  n.chapters.forEach(c=>{for(const m of (c.content||'').matchAll(/\[\[img:([\w-]+)/g))used.add(m[1])});
  used.forEach(id=>{
    if(have.has(id)){sent.push(id);return}
    const d=imgSrc(id);if(!d||d.length>900000||!SAFE_IMG.test(d))return;
    ops.push({f:b=>b.set(F.doc(sref,'images',id),{data:d}),sz:d.length+100});sent.push(id);
  });
  await commitOps(ops);
  n.pubImgs=sent;save();
}
async function doUnpub(n){
  const F=fb.f,sref=F.doc(fb.fs,'stories',n.pubId),ops=[];
  for(const sub of ['chapters','images']){const q=await F.getDocs(F.collection(sref,sub));q.forEach(d=>ops.push({f:b=>b.delete(d.ref),sz:1}))}
  await commitOps(ops);await F.deleteDoc(sref);
  delete n.pubId;delete n.pubOwner;delete n.pubAt;delete n.pubImgs;save();
}
async function pubAction(kind){
  const n=novel();if(!n)return;

  try{
    if(kind==='pub'){
      if(!n.chapters.length){alert('Truyện chưa có chương nào để đăng.');return}
      if(!n.pubId&&!confirm('Truyện này sẽ hiển thị công khai trong thư viện chung, ai cũng đọc được. Tiếp tục đăng?'))return;
      if(btn){btn.disabled=true;btn.textContent='Đang đăng…'}

      if(!confirm('Gỡ truyện khỏi thư viện chung? Bản trong tủ truyện của bạn vẫn được giữ lại.'))return;
      if(btn){btn.disabled=true;btn.textContent='Đang gỡ…'}
      await doUnpub(n);render();
    }
  }catch(e){console.error(e);alert(fbMsg(e));render()}
}

async function openStory(id){
  if(!SAFE_ID.test(id||''))return;
  const ok=await fbInit();if(!ok){openAuth();return}
  document.body.style.cursor='progress';
  try{
    const F=fb.f,s=await F.getDoc(F.doc(fb.fs,'stories',id));
    if(!s.exists()){alert('Truyện này không còn trên thư viện chung.');return}
    const d=s.data(),cs=await F.getDocs(F.query(F.collection(s.ref,'chapters'),F.orderBy('order')));
    const chapters=cs.docs.map((x,i)=>({id:'p'+i,title:String(x.data().title||''),content:String(x.data().content||'')}));
    if(!chapters.length){alert('Truyện này chưa có chương nào.');return}
    const ids=new Set();chapters.forEach(c=>{for(const m of c.content.matchAll(/\[\[img:([\w-]+)/g))ids.add(m[1])});
    await Promise.all([...ids].map(async i=>{
      if(imgSrc(i))return;
      try{const g=await F.getDoc(F.doc(s.ref,'images',i));const v=g.exists()?g.data().data:'';if(typeof v==='string'&&SAFE_IMG.test(v))imgMem[i]=v}catch(e){}
    }));
    tmp={id:'tmp',remote:true,srcId:id,title:String(d.title||''),author:String(d.author||d.ownerName||''),desc:String(d.desc||''),tags:cleanTags(d.tags),chapters};
    view={n:'pub',id:'tmp'};openReader(chapters[0].id);
  }catch(e){console.error(e);alert(fbMsg(e))}
  finally{document.body.style.cursor=''}
}
